Global:
  checkpoints: null
  pretrained_model: null
  output_dir: ../../../experiments/paddleclas_pplcnetv2/artifacts/run
  device: gpu
  save_interval: 5
  eval_during_train: True
  eval_interval: 1
  epochs: 40
  print_batch_step: 20
  use_visualdl: False
  image_shape: [3, 224, 224]
  save_inference_dir: ../../../experiments/paddleclas_pplcnetv2/artifacts/inference

AMP:
  use_amp: True
  use_fp16_test: False
  scale_loss: 128.0
  use_dynamic_loss_scaling: True
  use_promote: False
  level: O1

Arch:
  name: PPLCNetV2_base
  class_num: 2
  pretrained: True

Loss:
  Train:
    - CELoss:
        weight: 1.0
        epsilon: 0.1
  Eval:
    - CELoss:
        weight: 1.0

Optimizer:
  name: Momentum
  momentum: 0.9
  lr:
    name: Cosine
    learning_rate: 0.08
    warmup_epoch: 3
  regularizer:
    name: L2
    coeff: 0.00004

DataLoader:
  Train:
    dataset:
      name: ImageNetDataset
      image_root: ../../../datasets/seal_dataset_v6.2/
      cls_label_path: ../../../experiments/paddleclas_pplcnetv2/artifacts/seal_dataset_v6.2/train_list.txt
      transform_ops:
        - DecodeImage:
            to_rgb: True
            channel_first: False
        - RandCropImage:
            size: 224
        - RandFlipImage:
            flip_code: 1
        - NormalizeImage:
            scale: 1.0/255.0
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            order: ''
    sampler:
      name: DistributedBatchSampler
      batch_size: 64
      drop_last: False
      shuffle: True
    loader:
      num_workers: 4
      use_shared_memory: False
  Eval:
    dataset:
      name: ImageNetDataset
      image_root: ../../../datasets/seal_dataset_v6.2/
      cls_label_path: ../../../experiments/paddleclas_pplcnetv2/artifacts/seal_dataset_v6.2/val_list.txt
      transform_ops:
        - DecodeImage:
            to_rgb: True
            channel_first: False
        - ResizeImage:
            resize_short: 256
        - CropImage:
            size: 224
        - NormalizeImage:
            scale: 1.0/255.0
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]
            order: ''
    sampler:
      name: DistributedBatchSampler
      batch_size: 64
      drop_last: False
      shuffle: False
    loader:
      num_workers: 4
      use_shared_memory: False

Infer:
  infer_imgs: ../../../datasets/seal_dataset_v6.2/test
  batch_size: 64
  transforms:
    - DecodeImage:
        to_rgb: True
        channel_first: False
    - ResizeImage:
        resize_short: 256
    - CropImage:
        size: 224
    - NormalizeImage:
        scale: 1.0/255.0
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        order: ''
    - ToCHWImage:
  PostProcess:
    name: Topk
    topk: 2
    class_id_map_file: ../../../experiments/paddleclas_pplcnetv2/artifacts/seal_dataset_v6.2/class_id_map.txt

Metric:
  Train:
    - TopkAcc:
        topk: [1, 2]
  Eval:
    - TopkAcc:
        topk: [1, 2]
